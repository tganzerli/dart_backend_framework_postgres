name: dart_backend_framework_postgres
description: >
  PostgreSQL kit for dart_backend_framework: the pieces for using it together
  with dart_db_connector_postgres (a per-request row-level-security transaction
  middleware and a prefix tsquery builder).
version: 0.1.3
publish_to: none

repository: https://github.com/tganzerli/dart_backend_framework_postgres

environment:
  sdk: ^3.6.0

dependencies:
  dart_backend_framework:
    git:
      url: https://github.com/tganzerli/dart_backend_framework
      ref: v0.1.0
  dart_db_connector_postgres:
    git:
      url: https://github.com/tganzerli/dart_db_connector_postgres
      ref: v0.1.3
  meta: ^1.15.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
