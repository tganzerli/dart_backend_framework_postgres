name: dart_backend_framework_postgres
description: >
  PostgreSQL extensions for dart_backend_framework: a per-request
  row-level-security transaction middleware.
version: 0.1.0
publish_to: none

repository: https://github.com/tganzerli/dart_backend_framework_postgres

environment:
  sdk: ^3.6.0

dependencies:
  dart_backend_framework:
    git:
      url: https://github.com/tganzerli/dart_backend_framework
      ref: v0.1.0
  dart_db_connector_postgres:
    git:
      url: https://github.com/tganzerli/dart_db_connector_postgres
      ref: v0.1.0
  meta: ^1.15.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
